# This repository is the Warrior Borg experiment: a hard fork of the Borg mod
# that always plays an optimized warrior. Issues here are about the fork - the
# birth automation, the warrior tuning, the run records, the measurement
# harness. Upstream Borg defects belong upstream unless the fork changed them.
blank_issues_enabled: true

contact_links:
  - name: Upstream Borg mod
    url: https://github.com/neostryder/neo-angband-mod-borg
    about: >-
      This fork carries the upstream port of Angband's borg. A defect that
      reproduces with the upstream mod belongs in its tracker, not here.

  - name: The mod would not install, or two mods disagree
    url: https://github.com/neostryder/neo-angband/issues
    about: >-
      That is the mod system rather than any one mod, and the game's
      repository is where its code lives.
